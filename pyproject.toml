[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ledgerkit"
version = "0.1.0"
description = "Rebuild a per-wallet ETH/NFT ledger from raw EVM logs, and reconcile it."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["eth-abi>=5,<6"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
ledgerkit = "ledgerkit.cli:main"

[tool.setuptools.packages.find]
include = ["ledgerkit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
